name: Deploy docs

# Build the MkDocs (Material) site and publish it to GitHub Pages via the GitHub Actions
# deployment (no gh-pages branch). Runs when something that affects the docs changes on main,
# plus a manual trigger.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/urbanstyle/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.5,<10" "mkdocs-llmstxt>=0.5,<0.6"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build site (strict - fail on any broken link or nav reference)
        run: mkdocs build --strict

      # the dashboard online (docs/design/online-dashboard.md): `urbanstyle publish` writes it, it goes up as the asset demo.tar.gz of
      # the release demo-data, and here into site/demo/ with the keys from the repository's secrets (never in the repository)
      - name: The dashboard online
        env:
          GH_TOKEN: ${{ github.token }}
          CARTO: ${{ secrets.CARTO_DEMO_KEY }}
          GMAPS: ${{ secrets.GOOGLE_MAPS_DEMO_KEY }}
          GEMINI: ${{ secrets.GEMINI_DEMO_KEY }}
        run: |
          if gh release download demo-data --repo "$GITHUB_REPOSITORY" -p demo.tar.gz -D "$RUNNER_TEMP"; then
            mkdir -p site/demo && tar -xzf "$RUNNER_TEMP/demo.tar.gz" -C site/demo
            sed -i "s|__CARTO_DEMO_KEY__|$CARTO|g; s|__GOOGLE_MAPS_DEMO_KEY__|$GMAPS|g; s|__GEMINI_DEMO_KEY__|$GEMINI|g" site/demo/index.html
          else
            echo "no release demo-data: the site goes without the dashboard"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
