site_name: urbanstyle
site_description: Level-aware street space from OpenStreetMap - the right-of-way between buildings, cut into sections and intersections, split into travelway and pedestrian realm, from one duckOSM database
site_url: https://khoshkhah.github.io/urbanstyle/
repo_url: https://github.com/Khoshkhah/urbanstyle
repo_name: Khoshkhah/urbanstyle
edit_uri: edit/main/docs/

theme:
  name: material
  logo: img/logo.svg
  favicon: img/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Get started: get-started.md
  - The dashboard: dashboard.md
  - Gallery: gallery.md
  - How-to guides:
      - Build an area: how-to/build-an-area.md
      - Use the dashboard: how-to/use-the-dashboard.md
      - Ask questions: how-to/ask-questions.md
      - Check the data: how-to/check-the-data.md
      - Model a bridge: how-to/bridges.md
  - Reference:
      - Commands: reference/commands.md
      - Tables: reference/tables.md
      - Ids: reference/ids.md
      - Checks: reference/checks.md
      - "The format: requirements": design/format.md
  - Explanation:
      - The street space: explanation/street-space.md
      - Sources and accuracy: explanation/sources.md
      - The format and the standards: explanation/standards.md
  - Design notes:
      - design/index.md
      - "Our format and the standards (research)": design/standards-comparison.md
      - "The dashboard: its design": design/dashboard.md
      - "The dashboard online": design/online-dashboard.md
      - One unit in full: design/unit-dossier.md
      - What the sources hold: design/source-inventory.md
      - "Plots: where the street ends": design/plots.md
      - "Layers: the whole area as a hierarchy": design/space-layers.md
      - "Blocks first: blocks, sections, intersections": design/blocks.md
      - "The agreed street rules": design/street-rules.md
      - How the street map is made: design/pipeline.md
      - "Junctions from the road network": design/junctions.md
      - "The street from SUMO (proposed)": design/street-from-sumo.md
      - "Bridges in 3D": design/bridges-3d.md
      - "Bridge profile": design/bridge-profile.md
      - "Bridge heights without LiDAR": design/bridge-heights.md
      - "Research: how standards layer a street": design/layers-research.md
      - Street space: design/street-space.md
      - Specification: design/street-space-spec.md
      - Sections and intersections v2: design/section-intersection-v2.md
      - Network first (preview): design/network-first.md
      - The inside of a space: design/space-parts.md
      - Mapillary observations: design/mapillary.md
      - Street objects: design/street-objects.md
      - Objects, step 1: design/street-objects-step1.md
      - Strips, first version: design/street-strips-v1.md
      - "Sources and methods": design/provenance.md
      - Glossary: design/glossary.md
      - "Research: partitioning": design/partitioning-research.md
      - "Research: levels": design/levels-research.md
      - Units:
          - Skanstull: units/skanstull.md
          - W Broadway × Granville St: units/broadway-granville.md

plugins:
  - search
  # /llms.txt (an index for AI agents, llmstxt.org) and /llms-full.txt (every page as Markdown)
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >
        urbanstyle is an open format for city street space, and an open tool that builds it from open data: the
        street between the blocks, divided into sections, intersections, subsections and parts (lanes, sidewalk
        zones, kerbs, crossings, painted lines), with street objects, bridges and levels -2 to 2, and the source
        and method of every value. The format is a profile of CityGML 3.0, written as a CityJSON Extension.
      sections:
        Start:
          - index.md
          - get-started.md
          - dashboard.md
        How-to guides:
          - how-to/build-an-area.md
          - how-to/use-the-dashboard.md
          - how-to/ask-questions.md
          - how-to/check-the-data.md
          - how-to/bridges.md
        Reference:
          - reference/commands.md
          - reference/tables.md
          - reference/ids.md
          - reference/checks.md
          - design/format.md
        Explanation:
          - explanation/street-space.md
          - explanation/sources.md
          - explanation/standards.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# the builders are scripts, not pages
exclude_docs: |
  build_*.py
  plan.md
