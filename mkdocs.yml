site_name: urbanstyle
site_description: Level-aware street space from OpenStreetMap - the right-of-way between buildings, cut into sections and intersections, split into travelway and pedestrian realm, from one duckOSM database
site_url: https://khoshkhah.github.io/urbanstyle/
repo_url: https://github.com/Khoshkhah/urbanstyle
repo_name: Khoshkhah/urbanstyle
edit_uri: edit/main/docs/

theme:
  name: material
  logo: img/logo.svg
  favicon: img/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Get started: get-started.md
  - The dashboard: dashboard.md
  - Gallery: gallery.md
  - How-to guides:
      - Build an area: how-to/build-an-area.md
      - Use the dashboard: how-to/use-the-dashboard.md
      - Ask questions: how-to/ask-questions.md
      - Check the data: how-to/check-the-data.md
      - Model a bridge: how-to/bridges.md
  - Reference:
      - Commands: reference/commands.md
      - Tables: reference/tables.md
      - Ids: reference/ids.md
      - Checks: reference/checks.md
  - Explanation:
      - The street space: explanation/street-space.md
      - Sources and accuracy: explanation/sources.md
      - The format and the standards: explanation/standards.md
  - Design:
      - design/index.md
      - The model: design/model.md
      - The tables: design/tables.md
      - "Rank 1: the ground": design/ground.md
      - "Rank 2: the stretches": design/stretches.md
      - "Ranks 3 and 4: the spaces and their sides": design/spaces.md
      - "Ranks 5 and 6: the parts and the marks": design/parts.md
      - Street objects: design/objects.md
      - Levels, bridges and tunnels: design/levels.md
      - "Bridges by rank (proposal)": notes/bridges-ranks.md
      - "Bridge profile: the inputs": notes/bridge-profile-input.md
      - Sources and provenance: design/sources.md
      - The format: design/format.md
      - Drawing the tables: design/drawing.md
      - The dashboard: design/dashboard.md
      - Glossary: design/glossary.md
  - Research:
      - How the standards layer a street: design/layers-research.md
      - How others partition a street space: design/partitioning-research.md
      - How software handles levels: design/levels-research.md
      - Our format and the standards: design/standards-comparison.md
      - Pilots:
          - Skanstull: units/skanstull.md
          - W Broadway × Granville St: units/broadway-granville.md

plugins:
  - search
  # /llms.txt (an index for AI agents, llmstxt.org) and /llms-full.txt (every page as Markdown)
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >
        urbanstyle is an open format for city street space, and an open tool that builds it from open data: the
        street between the blocks, divided into sections, intersections, subsections and parts (lanes, sidewalk
        zones, kerbs, crossings, painted lines), with street objects, bridges and levels -2 to 2, and the source
        and method of every value. The format is a profile of CityGML 3.0, written as a CityJSON Extension.
      sections:
        Start:
          - index.md
          - get-started.md
          - dashboard.md
        How-to guides:
          - how-to/build-an-area.md
          - how-to/use-the-dashboard.md
          - how-to/ask-questions.md
          - how-to/check-the-data.md
          - how-to/bridges.md
        Reference:
          - reference/commands.md
          - reference/tables.md
          - reference/ids.md
          - reference/checks.md
          - design/format.md
        Explanation:
          - explanation/street-space.md
          - explanation/sources.md
          - explanation/standards.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# the builders are scripts, not pages
exclude_docs: |
  notes/
  !notes/bridges-ranks.md
  !notes/bridge-profile-input.md
  build_*.py
  plan.md
  HANDOFF.md
