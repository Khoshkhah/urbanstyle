[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanstyle"
dynamic = ["version"]
description = "Level-aware street space from OpenStreetMap: buildings, the right-of-way between them split into sections, intersections, travelway and pedestrian realm, and the links between levels, from one duckOSM database"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kaveh" }]
keywords = ["street space", "right-of-way", "urban", "OpenStreetMap", "duckOSM", "DuckDB", "levels", "roadstyle"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = ["duckdb>=1.1", "shapely>=2", "numpy", "pandas"]

[project.optional-dependencies]
dashboard = ["roadstyle>=0.13.1", "geopandas"]
osm = ["duckosm"]
dev = ["pytest"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "mkdocs-llmstxt>=0.5,<0.6"]

[project.scripts]
urbanstyle = "urbanstyle.cli:main"

[project.urls]
Homepage = "https://github.com/Khoshkhah/urbanstyle"
Repository = "https://github.com/Khoshkhah/urbanstyle"
Issues = "https://github.com/Khoshkhah/urbanstyle/issues"
duckOSM = "https://github.com/Khoshkhah/duckOSM"
roadstyle = "https://github.com/Khoshkhah/roadstyle"

[tool.setuptools.dynamic]
version = { attr = "urbanstyle.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
